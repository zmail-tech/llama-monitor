services:
  collector:
    image: ghcr.io/zmail-tech/llama-monitor:latest
    container_name: llama-collector
    env_file: .env
    environment:
      - COLLECTOR_PORT=7788
      - SCRAPE_INTERVAL=15
      - DB_PATH=/data/metrics.db
    ports:
      - "7788:7788"
    volumes:
      - collector-data:/data
      # Mount local frontend for dev overrides (optional):
      # - ./frontend:/app/frontend:ro
    restart: unless-stopped
    networks:
      - monitor

volumes:
  collector-data:
    external: true

networks:
  monitor:
    driver: bridge